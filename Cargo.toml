[package]
name = "mouse-gestures-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
evdev = "0.13.2"
log = "0.4.28"
mio = { version ="1.1.0", features = ["os-ext"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
udev = { version = "^0.9.3", features = ["send"] }
xdg = "3.0.0"
nix = { version = "0.29", features = ["ioctl", "fs", "event"] }
x11rb = "0.13.2"
linked_hash_set = "0.1.5"

[dev-dependencies]
mockall = "0.13.1"
