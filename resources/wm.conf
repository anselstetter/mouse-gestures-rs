# This is a collection of commands to get the current active app id, based on the current running wm.
# The schema looks like this:
# ${XDG_CURRENT_DESKTOP} = command

niri = niri msg focused-window | grep 'App ID:' | sed -E 's/.*App ID: "(.*)"/\1/'
mango = mmsg -g -o | awk '$3==1{mon=$1} END{print mon}' | xargs -I{} mmsg -g -c | awk -v mon="$(mmsg -g -o | awk '$3==1{print $1}')" '$1==mon && $2=="appid"{print $3}'
